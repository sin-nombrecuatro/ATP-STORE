<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/logo.png">
<title>Ingresar | ATP store</title>
</head>
<body data-page="login">
<div id="site-header"></div>
<main class="container auth-wrap">
  <div class="panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="on" data-tab="login" aria-selected="true">Iniciar sesión</button>
      <button type="button" role="tab" data-tab="register" aria-selected="false">Crear cuenta</button>
    </div>
    <div class="msg" id="msg" role="alert" hidden></div>

    <form id="form-login" novalidate>
      <label for="l-email">Correo electrónico</label>
      <input id="l-email" name="email" type="email" required autocomplete="email">
      <label for="l-pass">Contraseña</label>
      <input id="l-pass" name="password" type="password" required autocomplete="current-password">
      <p style="margin-top:20px"><button class="btn" type="submit" style="width:100%">Entrar</button></p>
    </form>

    <form id="form-register" hidden novalidate>
      <label for="r-name">Nombre completo</label>
      <input id="r-name" name="name" type="text" required minlength="2" autocomplete="name">
      <label for="r-email">Correo electrónico</label>
      <input id="r-email" name="email" type="email" required autocomplete="email">
      <label for="r-pass">Contraseña (mínimo 8 caracteres)</label>
      <input id="r-pass" name="password" type="password" required minlength="8" autocomplete="new-password">
      <label for="r-pass2">Repite la contraseña</label>
      <input id="r-pass2" name="password2" type="password" required minlength="8" autocomplete="new-password">
      <p style="margin-top:20px"><button class="btn" type="submit" style="width:100%">Crear cuenta</button></p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/advisor.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
