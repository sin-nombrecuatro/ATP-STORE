<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/logo.png">
<title>Carrito | ATP store</title>
</head>
<body data-page="carrito">
<div id="site-header"></div>
<main class="container block">
  <h2 class="section-title">Tu carrito</h2>
  <div id="cart-area" class="two-col">
    <div>
      <div id="cart-list"></div>
      <div id="checkout" class="panel wide" style="margin-top:20px" hidden>
        <h3 style="margin-top:0">Datos de envío</h3>
        <div class="msg" id="msg" role="alert" hidden></div>
        <form id="ship-form">
          <label for="fullName">Nombre completo</label><input id="fullName" name="fullName" required maxlength="80" autocomplete="name">
          <label for="phone">Teléfono</label><input id="phone" name="phone" required maxlength="20" autocomplete="tel" inputmode="tel">
          <label for="address">Dirección</label><input id="address" name="address" required maxlength="160" autocomplete="street-address">
          <label for="city">Ciudad</label><input id="city" name="city" required maxlength="60" autocomplete="address-level2">
          <p style="margin-top:20px"><button class="btn" type="submit">Confirmar pedido</button></p>
        </form>
      </div>
    </div>
    <aside>
      <div class="panel wide" id="summary" hidden></div>
      <p id="login-hint" class="msg ok" hidden style="margin-top:14px">Para finalizar tu compra necesitas <a href="/login?next=/carrito">iniciar sesión</a> o <a href="/login#registro">crear una cuenta</a>.</p>
    </aside>
  </div>
  <div id="done" hidden></div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/advisor.js"></script>
<script src="/js/carrito.js"></script>
</body>
</html>
