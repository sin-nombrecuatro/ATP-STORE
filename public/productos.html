<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/logo.png">
<title>Productos | ATP store</title>
</head>
<body data-page="productos">
<div id="site-header"></div>
<main class="container block">
  <h2 class="section-title">Productos</h2>
  <p class="section-sub" id="count">&nbsp;</p>
  <div class="chips" id="chips" role="group" aria-label="Categorías">
    <button class="chip" data-cat="" type="button">Todo</button>
    <button class="chip" data-cat="Mujer" type="button">Mujer</button>
    <button class="chip" data-cat="Hombre" type="button">Hombre</button>
    <button class="chip" data-cat="Calzado" type="button">Calzado</button>
    <button class="chip" data-cat="Accesorios" type="button">Accesorios</button>
  </div>
  <div class="filters">
    <div><label for="q">Buscar</label><input id="q" type="search" placeholder="jean, vestido, azul…"></div>
    <div><label for="max">Precio máximo</label>
      <select id="max"><option value="">Sin límite</option><option value="60000">Hasta $60.000</option><option value="100000">Hasta $100.000</option><option value="150000">Hasta $150.000</option></select></div>
    <div><label for="sort">Ordenar por</label>
      <select id="sort"><option value="">Destacados</option><option value="price_asc">Precio: menor a mayor</option><option value="price_desc">Precio: mayor a menor</option><option value="new">Más nuevos</option></select></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/advisor.js"></script>
<script src="/js/productos.js"></script>
</body>
</html>
