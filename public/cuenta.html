<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/logo.png">
<title>Mi cuenta | ATP store</title>
</head>
<body data-page="cuenta">
<div id="site-header"></div>
<main class="container block">
  <h2 class="section-title" id="hello">Mi cuenta</h2>
  <p class="section-sub" id="email">&nbsp;</p>
  <div class="two-col">
    <div><h3>Mis pedidos</h3><div id="orders"><p class="empty">Cargando…</p></div></div>
    <div class="panel wide">
      <h3 style="margin-top:0">Preferencias para el asesor</h3>
      <div class="msg" id="msg" role="status" hidden></div>
      <form id="pref-form">
        <label for="style">Estilo favorito</label><input id="style" name="style" maxlength="80" placeholder="casual, elegante, deportivo…">
        <label for="size">Talla habitual</label><input id="size" name="size" maxlength="10" placeholder="M">
        <label for="budget">Presupuesto por prenda (COP)</label><input id="budget" name="budget" type="number" min="0" step="1000">
        <p style="margin-top:18px"><button class="btn small" type="submit">Guardar</button></p>
      </form>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/advisor.js"></script>
<script src="/js/cuenta.js"></script>
</body>
</html>
